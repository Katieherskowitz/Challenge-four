<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FO RM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>

    <header class="site-header">
        <span class="title">F O &nbsp; R M</span>
        <span class="subtitle">vol. 01</span>
    </header>

    <main class="notebook-container">
        <div class="notebook">
            <!-- Left Page -->
            <div class="page page-left">
                <div class="page-inner">
                    <div class="section section-top" data-section="left-top">
                        <div class="section-track">
                            <!-- Slide 1: metallic peel top third -->
                            <div class="slide slide-image" data-index="0" style="background-image: url('images/metallic_peel_01.jpg'); background-position: center top;"></div>
                            <!-- Slide 2: FO RM logo top area (white space) -->
                            <div class="slide slide-content" data-index="1">
                                <div class="slide-inner type-page"></div>
                            </div>
                            <!-- Slide 3: glitch purple top third -->
                            <div class="slide slide-image" data-index="2" style="background-image: url('images/glitch_purple.jpg'); background-position: center top;"></div>
                            <!-- Slide 4: text page - "NOTHING HERE EXISTS ON ITS OWN" -->
                            <div class="slide slide-content" data-index="3">
                                <div class="slide-inner type-page type-text-top">
                                    <span class="editorial-text text-left">NOTHING HERE EXISTS ON ITS OWN.</span>
                                </div>
                            </div>
                            <!-- Slide 5: print bw top third -->
                            <div class="slide slide-image" data-index="4" style="background-image: url('images/print_bw.jpg'); background-position: center top;"></div>
                        </div>
                        <div class="section-edge"></div>
                    </div>
                    <div class="section section-middle" data-section="left-middle">
                        <div class="section-track">
                            <!-- Slide 1: metallic peel middle third -->
                            <div class="slide slide-image" data-index="0" style="background-image: url('images/metallic_peel_01.jpg'); background-position: center center;"></div>
                            <!-- Slide 2: text - "AN ARCHIVE OF TRANSFORMATION" -->
                            <div class="slide slide-content" data-index="1">
                                <div class="slide-inner type-page type-text-mid">
                                    <span class="editorial-text text-right">AN ARCHIVE OF TRANSFORMATION.</span>
                                </div>
                            </div>
                            <!-- Slide 3: glitch purple middle third -->
                            <div class="slide slide-image" data-index="2" style="background-image: url('images/glitch_purple.jpg'); background-position: center center;"></div>
                            <!-- Slide 4: layers torn -->
                            <div class="slide slide-image" data-index="3" style="background-image: url('images/layers_torn.jpg'); background-position: center center;"></div>
                            <!-- Slide 5: metallic peel 02 middle -->
                            <div class="slide slide-image" data-index="4" style="background-image: url('images/metallic_peel_02.jpg'); background-position: center center;"></div>
                        </div>
                        <div class="section-edge"></div>
                    </div>
                    <div class="section section-bottom" data-section="left-bottom">
                        <div class="section-track">
                            <!-- Slide 1: metallic peel bottom third -->
                            <div class="slide slide-image" data-index="0" style="background-image: url('images/metallic_peel_01.jpg'); background-position: center bottom;"></div>
                            <!-- Slide 2: FO RM logo bottom ("FO" text) -->
                            <div class="slide slide-content" data-index="1">
                                <div class="slide-inner type-page type-logo-bottom">
                                    <span class="logo-text logo-fo">FO</span>
                                </div>
                            </div>
                            <!-- Slide 3: glitch purple bottom third -->
                            <div class="slide slide-image" data-index="2" style="background-image: url('images/glitch_purple.jpg'); background-position: center bottom;"></div>
                            <!-- Slide 4: "EACH PIECE BELONGS TO SOMETHING LARGER" -->
                            <div class="slide slide-content" data-index="3">
                                <div class="slide-inner type-page type-text-bottom">
                                    <span class="editorial-text text-left">EACH PIECE BELONGS TO SOMETHING LARGER.</span>
                                </div>
                            </div>
                            <!-- Slide 5: print bw bottom third -->
                            <div class="slide slide-image" data-index="4" style="background-image: url('images/print_bw.jpg'); background-position: center bottom;"></div>
                        </div>
                        <div class="section-edge"></div>
                    </div>
                </div>
                <div class="page-shadow page-shadow-left"></div>
                <div class="page-texture"></div>
            </div>

            <!-- Spiral Binding -->
            <div class="spiral-binding">
                <div class="spiral-ring" style="--i:0"></div>
                <div class="spiral-ring" style="--i:1"></div>
                <div class="spiral-ring" style="--i:2"></div>
                <div class="spiral-ring" style="--i:3"></div>
                <div class="spiral-ring" style="--i:4"></div>
                <div class="spiral-ring" style="--i:5"></div>
                <div class="spiral-ring" style="--i:6"></div>
                <div class="spiral-ring" style="--i:7"></div>
                <div class="spiral-ring" style="--i:8"></div>
                <div class="spiral-ring" style="--i:9"></div>
                <div class="spiral-ring" style="--i:10"></div>
                <div class="spiral-ring" style="--i:11"></div>
                <div class="spiral-ring" style="--i:12"></div>
                <div class="spiral-ring" style="--i:13"></div>
                <div class="spiral-ring" style="--i:14"></div>
                <div class="spiral-ring" style="--i:15"></div>
                <div class="spiral-ring" style="--i:16"></div>
                <div class="spiral-spine"></div>
            </div>

            <!-- Right Page -->
            <div class="page page-right">
                <div class="page-inner">
                    <div class="section section-top" data-section="right-top">
                        <div class="section-track">
                            <!-- Slide 1: glitch brown top third -->
                            <div class="slide slide-image" data-index="0" style="background-image: url('images/glitch_brown.jpg'); background-position: center top;"></div>
                            <!-- Slide 2: FO RM logo top ("RM" text) -->
                            <div class="slide slide-content" data-index="1">
                                <div class="slide-inner type-page type-logo-top">
                                    <span class="logo-text logo-rm">RM</span>
                                </div>
                            </div>
                            <!-- Slide 3: urban torn top third -->
                            <div class="slide slide-image" data-index="2" style="background-image: url('images/urban_torn.jpg'); background-position: center top;"></div>
                            <!-- Slide 4: metallic peel 02 top -->
                            <div class="slide slide-image" data-index="3" style="background-image: url('images/metallic_peel_02.jpg'); background-position: center top;"></div>
                            <!-- Slide 5: white "ONE HOUR WALK" page top -->
                            <div class="slide slide-content" data-index="4">
                                <div class="slide-inner type-page"></div>
                            </div>
                        </div>
                        <div class="section-edge"></div>
                    </div>
                    <div class="section section-middle" data-section="right-middle">
                        <div class="section-track">
                            <!-- Slide 1: glitch brown middle third -->
                            <div class="slide slide-image" data-index="0" style="background-image: url('images/glitch_brown.jpg'); background-position: center center;"></div>
                            <!-- Slide 2: white space -->
                            <div class="slide slide-content" data-index="1">
                                <div class="slide-inner type-page type-text-walk">
                                    <span class="editorial-text text-right">ONE HOUR WALK</span>
                                </div>
                            </div>
                            <!-- Slide 3: urban torn middle third -->
                            <div class="slide slide-image" data-index="2" style="background-image: url('images/urban_torn.jpg'); background-position: center center;"></div>
                            <!-- Slide 4: print bw middle -->
                            <div class="slide slide-image" data-index="3" style="background-image: url('images/print_bw.jpg'); background-position: center center;"></div>
                            <!-- Slide 5: layers torn middle -->
                            <div class="slide slide-image" data-index="4" style="background-image: url('images/layers_torn.jpg'); background-position: center top;"></div>
                        </div>
                        <div class="section-edge"></div>
                    </div>
                    <div class="section section-bottom" data-section="right-bottom">
                        <div class="section-track">
                            <!-- Slide 1: glitch brown bottom third -->
                            <div class="slide slide-image" data-index="0" style="background-image: url('images/glitch_brown.jpg'); background-position: center bottom;"></div>
                            <!-- Slide 2: page number area -->
                            <div class="slide slide-content" data-index="1">
                                <div class="slide-inner type-page type-page-num">
                                    <span class="page-num">003</span>
                                </div>
                            </div>
                            <!-- Slide 3: urban torn bottom third -->
                            <div class="slide slide-image" data-index="2" style="background-image: url('images/urban_torn.jpg'); background-position: center bottom;"></div>
                            <!-- Slide 4: metallic peel 02 bottom -->
                            <div class="slide slide-image" data-index="3" style="background-image: url('images/metallic_peel_02.jpg'); background-position: center bottom;"></div>
                            <!-- Slide 5: layers torn bottom -->
                            <div class="slide slide-image" data-index="4" style="background-image: url('images/layers_torn.jpg'); background-position: center bottom;"></div>
                        </div>
                        <div class="section-edge"></div>
                    </div>
                </div>
                <div class="page-shadow page-shadow-right"></div>
                <div class="page-texture"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <span class="hint">drag sections to explore</span>
        <span class="page-indicator" id="pageIndicator"></span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
